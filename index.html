<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Image Optimizer GUI - Triii Technologies LLC</title>

  <!-- SweetAlert2 CSS & JS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    /* Reset and Core Layout */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #181825;
      color: #cdd6f4;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* --- Frameless Window Draggable Header --- */
    .app-header {
      height: 36px;
      background-color: #1e1e2e;
      display: flex;
      align-items: center;
      padding-left: 16px;
      -webkit-app-region: drag;
      user-select: none;
      border-bottom: 1px solid #313244;
    }
    .app-title {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #a6adc8;
      text-transform: uppercase;
    }

    /* Main Content Area */
    .app-body {
      flex: 1;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow: hidden;
    }

    /* Configuration Panel */
    .panel {
      background-color: #1e1e2e;
      border: 1px solid #313244;
      border-radius: 8px;
      padding: 16px;
    }
    .flex-row {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 12px;
    }
    .flex-row:last-child {
      margin-bottom: 0;
    }

    /* Form UI Elements */
    label {
      font-size: 14px;
      color: #bac2de;
    }
    input[type="text"] {
      flex: 1;
      background-color: #313244;
      border: 1px solid #45475a;
      color: #cdd6f4;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #89b4fa;
    }

    /* Interactive elements */
    button {
      -webkit-app-region: no-drag;
      background-color: #89b4fa;
      color: #11111b;
      border: none;
      padding: 6px 16px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    button:hover {
      background-color: #b4befe;
    }
    .btn-secondary {
      background-color: #45475a;
      color: #cdd6f4;
    }
    .btn-secondary:hover {
      background-color: #585b70;
    }

    /* Checkboxes */
    .checkbox-group {
      display: flex;
      gap: 16px;
      margin-top: 8px;
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    /* Terminal Console Log Output */
    .log-container {
      flex: 1;
      background-color: #11111b;
      border: 1px solid #313244;
      border-radius: 8px;
      padding: 14px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 13px;
      line-height: 1.5;
      color: #a6e3a1;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    /* --- SweetAlert2 Dark Mode Overrides --- */
    .swal2-popup {
      background-color: #1e1e2e !important;
      color: #cdd6f4 !important;
      border: 1px solid #313244 !important;
      font-family: inherit !important;
    }
    .swal2-title {
      color: #bac2de !important;
    }
    .swal2-html-container, .swal2-confirm, .swal2-cancel {
      color: #cdd6f4 !important;
    }
    .swal2-confirm {
      background-color: #89b4fa !important;
      border: none !important;
      font-weight: 600 !important;
      border-radius: 6px !important;
      color: #11111b !important;
    }
    .swal2-confirm:hover {
      background-color: #b4befe !important;
    }
    .swal2-cancel {
      background-color: #45475a !important;
      border: none !important;
      font-weight: 600 !important;
      border-radius: 6px !important;
      color: #cdd6f4 !important;
    }
    .swal2-cancel:hover {
      background-color: #585b70 !important;
    }
    .swal2-icon.swal2-warning {
      border-color: #f9e2af !important;
      color: #f9e2af !important;
    }

    /* --- Custom Loading Spinner Styles --- */
    .sweet-spinner {
      border: 4px solid rgba(137, 180, 250, 0.1);
      border-left-color: #89b4fa;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 12px auto 0 auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Section Label */
    .section-label {
      font-size: 13px;
      color: #a6adc8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

<!-- Custom Frameless App Header -->
<header class="app-header">
  <div class="app-title">Web Image Optimization Utility</div>
</header>

<!-- Application Window Workspace -->
<main class="app-body">

  <!-- Configuration Panel: Batch Processing -->
  <section class="panel">
    <div class="section-label">Batch Image Optimization</div>
    <div class="flex-row">
      <input type="text" id="inputPath" placeholder="Select source pictures folder path..." readonly />
      <button id="btnBrowseInput" onclick="pickFolder('inputPath')" class="btn-secondary">Browse Source</button>
    </div>
    <div class="flex-row">
      <input type="text" id="outputPath" placeholder="Select conversion output directory path..." readonly />
      <button id="btnBrowseOutput" onclick="pickFolder('outputPath')" class="btn-secondary">Browse Output</button>
    </div>
    <div class="checkbox-group">
      <label class="checkbox-label">
        <input type="checkbox" id="chkWebp" checked> Optimize Images with WebP Format
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="chkStrip" checked> Strip Metadata (EXIF)
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="chkGps" checked> Redact GPS Coordinates (EXIF)
      </label>
    </div>
  </section>

  <!-- Configuration Panel: Icon Kit Generation -->
  <section class="panel">
    <div class="section-label">Favicon / Icon Kit Generator</div>
    <div class="flex-row">
      <input type="text" id="sourceImagePath" placeholder="Select source image for icon generation..." readonly />
      <button onclick="pickFile('sourceImagePath')" class="btn-secondary">Browse Source Image</button>
    </div>
    <div class="flex-row">
      <input type="text" id="iconKitOutputPath" placeholder="Select output directory for icons..." readonly />
      <button onclick="pickFolder('iconKitOutputPath')" class="btn-secondary">Browse Output</button>
    </div>
  </section>

  <!-- Action Buttons -->
  <div class="flex-row" style="justify-content: space-between;">
    <button id="btnGenerateIcons" onclick="generateIconKit()" style="padding: 10px 24px; font-size: 14px;" class="btn-secondary">🎨 Generate Icon Kit</button>
    <button id="btnStart" onclick="runPipeline()" style="padding: 10px 24px; font-size: 14px;">Optimize Images</button>
  </div>

  <!-- Live Active Console Logging Monitor -->
  <h3>System Logs</h3>
  <div class="log-container" id="logOutput">Welcome. <br /><br />Web Image Optimization Utility is a GUI for transforming and altering images to be better served over a web environment<br /><b>Select paths to begin.</b>
  </div>

  <!-- Footer -->
  <div style="text-align: center; font-size: 24px; color: #585b70;">
    Built With ❤️ By <a id="triii-link" href="#" style="color: #bac2de; text-decoration: none; cursor: pointer;">Triii Technologies LLC</a>
  </div>
</main>

<script>
  document.getElementById('triii-link').addEventListener('click', (event) => {
    event.preventDefault();
    window.electronAPI.openBrowser('https://www.triii.org/');
  });

  const logOutput = document.getElementById('logOutput');

  function appendLog(text) {
    const timestamp = new Date().toLocaleTimeString();
    logOutput.innerText += `\n[${timestamp}] ${text}`;
    logOutput.scrollTop = logOutput.scrollHeight;
  }

  // ─── Folder Selection ──────────────────────────────────────────────

  async function pickFolder(elementId) {
    const title = elementId === 'inputPath' ? 'Select Image Source Folder' : 'Select Output Folder';
    const chosenPath = await window.electronAPI.selectDirectory(title);

    if (chosenPath) {
      document.getElementById(elementId).value = chosenPath;
      appendLog(`Path assigned: ${chosenPath}`);
    }
  }

  // ─── File Selection (Source Image) ────────────────────────────────

  async function pickFile(elementId) {
    const title = elementId === 'sourceImagePath' ? 'Select Source Image (PNG/JPG)' : 'Select Output Folder';
    const chosenPath = await window.electronAPI.selectFile(title);

    if (chosenPath) {
      document.getElementById(elementId).value = chosenPath;
      appendLog(`Source image assigned: ${chosenPath}`);
    }
  }

  // ─── Icon Kit Generation ──────────────────────────────────────────

  async function generateIconKit() {
    const sourceField = document.getElementById('sourceImagePath');
    const outputField = document.getElementById('iconKitOutputPath');
    const sourceImage = sourceField.value;
    const outputPath = outputField.value;
    const btnGenerateIcons = document.getElementById('btnGenerateIcons');

    if (!sourceImage || !outputPath) {
      await Swal.fire({
        title: 'Missing Paths',
        text: 'Please select a source image and output directory for icon generation.',
        icon: 'warning',
        confirmButtonText: 'OK'
      });
      return;
    }

    btnGenerateIcons.disabled = true;
    appendLog("Initializing Icon Kit Generator...");

    Swal.fire({
      title: 'Generating Icons',
      html: `<div class="sweet-spinner"></div><br>Creating favicon kit.<br>Please do not close this window.`,
      showConfirmButton: false,
      allowOutsideClick: false,
      background: '#1e1e2e',
      color: '#cdd6f4'
    });

    try {
      const result = await window.electronAPI.generateIconKit(sourceImage, outputPath);

      if (result.success) {
        appendLog(result.data.log || `✓ Icon Kit generated successfully!`);

        await Swal.fire({
          title: 'Icon Kit Generated',
          html: `Generated <b>${result.data.fileCount}</b> icons in:<br><code style="color:#89b4fa">${result.data.directory}</code>`,
          icon: 'success',
          confirmButtonText: 'Close'
        });

        document.getElementById('sourceImagePath').value = '';
        document.getElementById('iconKitOutputPath').value = '';
      } else {
        appendLog(`✗ Icon Kit generation failed: ${result.error}`);

        await Swal.fire({
          title: 'Icon Kit Error',
          text: result.error || 'An unexpected error occurred during icon kit generation.',
          icon: 'error',
          confirmButtonText: 'Dismiss'
        });
      }
    } catch (err) {
      appendLog(`CRITICAL FAILURE: ${err.message}`);

      await Swal.fire({
        title: 'Icon Kit Error',
        text: err.message || 'An unexpected error occurred during icon kit generation.',
        icon: 'error',
        confirmButtonText: 'Dismiss'
      });
    } finally {
      btnGenerateIcons.disabled = false;
    }
  }

  // ─── Batch Image Processing Pipeline ──────────────────────────────

  async function runPipeline() {
    const inputField = document.getElementById('inputPath');
    const outputField = document.getElementById('outputPath');
    const input = inputField.value;
    const output = outputField.value;
    const runBtn = document.getElementById('btnStart');

    if (!input || !output) {
      await Swal.fire({
        title: 'Missing Directories',
        text: 'Please select your input and output directories first.',
        icon: 'warning',
        confirmButtonText: 'OK'
      });
      return;
    }

    runBtn.disabled = true;
    appendLog("Initializing processBatch runtime thread...");

    Swal.fire({
      title: 'Processing Images',
      html: `<div class="sweet-spinner"></div><br>Optimizing your files.<br>Please do not close this window.`,
      showConfirmButton: false,
      allowOutsideClick: false,
      background: '#1e1e2e',
      color: '#cdd6f4'
    });

    try {
      const options = {
        stripMeta: document.getElementById('chkStrip').checked,
        toWebp: document.getElementById('chkWebp').checked,
        redactGps: document.getElementById('chkGps').checked,
        generateIcons: !!document.getElementById('sourceImagePath').value,
        sourceImageForIcons: document.getElementById('sourceImagePath').value || null
      };

      const result = await window.electronAPI.processImages(input, output, options);
      appendLog(result.data.log);

      if (result.data.iconKit) {
        const iconKit = result.data.iconKit;
        appendLog(`✓ Icon Kit: ${iconKit.fileCount} icons in icon-kit/`);


        await Swal.fire({
          title: 'Processing Complete',
          html: `Succeeded: <b>${result.data.success}</b><br>Failed: <b>${result.data.failures}</b><br><br>Icon Kit: <b>${iconKit.fileCount} icons</b> generated in icon-kit/`,
          icon: 'success',
          confirmButtonText: 'Close'
        });

        document.getElementById('sourceImagePath').value = '';
        document.getElementById('iconKitOutputPath').value = '';
      } else {
        await Swal.fire({
          title: 'Processing Complete',
          html: `Succeeded: <b>${result.data.success}</b><br>Failed: <b>${result.data.failures}</b>`,
          icon: 'success',
          confirmButtonText: 'Close'
        });
      }

    } catch (err) {
      appendLog(`CRITICAL FAILURE: ${err.message}`);

      await Swal.fire({
        title: 'Pipeline Error',
        text: err.message || 'An unexpected error occurred during image processing.',
        icon: 'error',
        confirmButtonText: 'Dismiss'
      });
    } finally {
      runBtn.disabled = false;
      inputField.value = "";
      outputField.value = "";
    }
  }
</script>
</body>
</html>
